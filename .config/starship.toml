"$schema" = 'https://starship.rs/config-schema.json'

# ============================================================
# Vaporwave palette
# ============================================================

palette = 'vaporwave'

[palettes.vaporwave]
void = '#050816'
blue = '#071DFF'
magenta = '#FF29E8'
cyan = '#00F5FF'
violet = '#8B5CFF'
white = '#F7F4FF'
muted = '#8290B5'
green = '#70F5B5'

# ============================================================
# Main prompt
# ============================================================

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# ============================================================
# Directory
# ============================================================

[directory]
style = 'bold cyan'
truncation_length = 3
truncation_symbol = '…/'
read_only = ' '
read_only_style = 'bold magenta'

# ============================================================
# Git
# ============================================================

[git_branch]
symbol = ' '
style = 'bold violet'
format = 'on [$symbol$branch]($style) '

[git_status]
style = 'bold magenta'
format = '([$all_status$ahead_behind]($style) )'

conflicted = '=${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

# ============================================================
# Prompt character
# ============================================================

[character]
success_symbol = '[❯](bold cyan)'
error_symbol = '[❯](bold magenta)'
vimcmd_symbol = '[❮](bold violet)'
vimcmd_replace_one_symbol = '[❮](bold magenta)'
vimcmd_replace_symbol = '[❮](bold magenta)'
vimcmd_visual_symbol = '[❮](bold violet)'

# ============================================================
# Command status and duration
# ============================================================

[cmd_duration]
min_time = 1000
format = 'took [$duration]($style) '
style = 'muted'

[status]
style = 'bold magenta'
symbol = '✗ '
success_symbol = ''
format = '[$symbol$status]($style) '
disabled = false

# ============================================================
# User and host
# ============================================================

[username]
style_user = 'bold cyan'
style_root = 'bold magenta'
show_always = false
format = '[$user]($style) '

[hostname]
style = 'bold violet'
ssh_only = true
format = '[@$hostname]($style) '

# ============================================================
# Programming languages and runtimes
# ============================================================

